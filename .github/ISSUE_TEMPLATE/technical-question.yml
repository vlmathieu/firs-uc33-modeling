name: Technical question
description: Stuck on an installation, a script, an error. Filling this form in is already building a reproducible example.
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        A question asked here gets an answer **the whole cohort can read**.
        That is the point of this channel: your problem is rarely yours alone.

        Fill the fields in order. It is common to find the answer while writing the
        form — that is normal, and it is the point.

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15.2 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Language and version
      description: "From `R.version.string`, `python --version`, `quarto --version`, `git --version`."
      placeholder: "Python 3.12.4 / R 4.4.1"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What you were trying to do
      description: One or two sentences. The goal, not the symptom.
      placeholder: "Load comtrade_fr_roundwood_dirty.csv from lab 2 and compute a unit value."
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: The minimal code that reproduces the problem
      description: >-
        As short as possible. Strip out everything that is not needed to trigger the
        error — that reduction often reveals the cause on its own.
      render: r
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: The COMPLETE error message
      description: >-
        Copied as text, not as a screenshot, and in full — including the lines that look
        irrelevant. The cause is almost always in there.
      render: shell
    validations:
      required: true

  - type: textarea
    id: attempts
    attributes:
      label: What you have already tried
      description: Saves you being told to do what you have just done.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have read the error message in full.
          required: true
        - label: I have searched the repository issues for the same question.
          required: true
        - label: My code contains no absolute path and no `setwd()`.
          required: true
